version: '3.8'

services:
  # Milvus Vector Database
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-search-network

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-search-network

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - video-search-network

  # Redis for task queue and caching
  redis:
    container_name: video-search-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - video-search-network

  # Search API (FastAPI)
  search-api:
    container_name: video-search-api
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - STORAGE_PATH=/app/storage
    volumes:
      - video-storage:/app/storage
      - video-chunks:/tmp/video_chunks
      - video-thumbnails:/tmp/video_thumbnails
    depends_on:
      - redis
      - milvus-standalone
    networks:
      - video-search-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RTSP Worker
  rtsp-worker:
    container_name: video-search-rtsp-worker
    build:
      context: ..
      dockerfile: deployment/worker.Dockerfile
    command: python processing/rtsp_worker.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - STORAGE_PATH=/app/storage
    volumes:
      - video-storage:/app/storage
      - video-chunks:/tmp/video_chunks
      - video-thumbnails:/tmp/video_thumbnails
    depends_on:
      - redis
      - milvus-standalone
      - search-api
    networks:
      - video-search-network
    restart: unless-stopped

  # URL/Upload Worker - Instance 1
  url-upload-worker-1:
    container_name: video-search-url-worker-1
    build:
      context: ..
      dockerfile: deployment/worker.Dockerfile
    command: python processing/url_upload_worker.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - STORAGE_PATH=/app/storage
    volumes:
      - video-storage:/app/storage
      - video-chunks:/tmp/video_chunks
      - video-thumbnails:/tmp/video_thumbnails
    depends_on:
      - redis
      - milvus-standalone
      - search-api
    networks:
      - video-search-network
    restart: unless-stopped

  # URL/Upload Worker - Instance 2 (for horizontal scaling)
  url-upload-worker-2:
    container_name: video-search-url-worker-2
    build:
      context: ..
      dockerfile: deployment/worker.Dockerfile
    command: python processing/url_upload_worker.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - STORAGE_PATH=/app/storage
    volumes:
      - video-storage:/app/storage
      - video-chunks:/tmp/video_chunks
      - video-thumbnails:/tmp/video_thumbnails
    depends_on:
      - redis
      - milvus-standalone
      - search-api
    networks:
      - video-search-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    container_name: video-search-frontend
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - search-api
    networks:
      - video-search-network
    restart: unless-stopped

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  redis-data:
  video-storage:
  video-chunks:
  video-thumbnails:

networks:
  video-search-network:
    driver: bridge
